[project]
name = "rivage-clair"
version = "0.1.1"
description = "Python-native data transformation framework for Snowflake"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Omer Baddour", email = "contact.omerbaddour@gmail.com" },
]
urls = { Homepage = "https://rivage-sh.github.io/clair/" }
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "click>=8.0",
    "snowflake-connector-python[pandas]>=3.0",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "uuid6>=2022.10.25",
    "structlog>=25.5.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
examples = [
    "jupyter",
    "ipykernel",
    "matplotlib",
    "pyvis",
]

[project.scripts]
clair = "clair.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Snowflake connection",
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
    # The Snowflake connector calls deprecated functions. clair cannot correct
    # this code. Remove each line when the connector corrects it.
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning",
    "ignore:is_datetime64tz_dtype is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-minify-plugin>=0.8",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
# E501 is not in ruff's default rule set, so this governs one thing only: how wide
# an import may be before isort wraps it. 88 (ruff's default) split single-name
# aliased imports that are perfectly readable on one line.
line-length = 130

# split-on-trailing-comma is left at its default (true) on purpose: an import block
# already exploded one-name-per-line stays that way, which is the preferred style here.
