site_name: clair
site_description: Python-native data transformation framework for Snowflake
site_url: https://rivage-sh.github.io/clair
repo_url: https://github.com/rivage-sh/clair
repo_name: rivage-sh/clair
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/clair_logo.png
  favicon: assets/clair_logo.png
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Getting Started:
    - index.md
    - Installation: installation.md
    - Quickstart: quickstart.md
  - Topics:
    - topics/index.md
    - Trouve: topics/trouve.md
    - Project Layout: topics/project-layout.md
    - DAG: topics/dag.md
    - The Anatomy of a Run: topics/anatomy-of-a-run.md
    - Environments: topics/environments.md
    - Selectors: topics/selectors.md
    - Data Quality Tests: topics/data-quality-tests.md
    - Staging: topics/staging.md
    - Incrementality: topics/incrementality.md
    - Pandas-Native Transformations: topics/pandas-native.md
    - Seeds: topics/seeds.md
    - Routing: topics/routing.md
    - Per-Database & Schema Config: topics/per-database-schema-config.md
  - CLI:
    - cli/overview.md
    - clair init: cli/init.md
    - clair run: cli/run.md
    - clair compile: cli/compile.md
    - clair test: cli/test.md
    - clair validate: cli/validate.md
    - clair dag: cli/dag.md
    - clair docs: cli/docs.md
    - clair clean: cli/clean.md
  - Reference:
    - reference/index.md
    - Python API: reference/python-api.md
    - Trouve: reference/trouve-api.md
    - Column: reference/column-api.md
    - RunConfig: reference/run-config-api.md
    - Tests: reference/tests-api.md
