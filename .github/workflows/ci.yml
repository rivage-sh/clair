name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Run ruff
        run: uvx ruff check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install deps
        run: uv sync

      - name: Run ty
        run: uvx ty check --exclude examples/notebooks

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # The integration tests need Snowflake credentials, thus this job
      # deselects them. The Integration workflow runs them.
      - name: Run tests
        run: uv run pytest -m "not integration"
