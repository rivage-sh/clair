name: Integration Cleanup

# The schemas of a run stay after the tests, thus you can read the tables of a
# failed run. This job drops them when the pull request closes.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      schema_name:
        description: The schema to drop, for example PR_42
        required: true

permissions:
  contents: read

concurrency:
  group: integration-cleanup-${{ github.event.pull_request.number || inputs.schema_name }}
  cancel-in-progress: false

jobs:
  drop-schema:
    name: Drop the schema of the run
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: snowflake-integration

    env:
      CLAIR_PR_TESTING_SCHEMA_NAME: >-
        ${{ github.event_name == 'pull_request'
            && format('pr_{0}', github.event.pull_request.number)
            || inputs.schema_name }}
      CLAIR_PR_TESTING_SNOWFLAKE_ACCOUNT: ${{ secrets.CLAIR_PR_TESTING_SNOWFLAKE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: uv sync

      - name: Write the private key
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.CLAIR_PR_TESTING_SNOWFLAKE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/clair_pr_testing_f.p8"
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 -d > "$key_path"
          chmod 600 "$key_path"
          echo "CLAIR_PR_TESTING_SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Drop the schema
        run: uv run python -m tests.integration.clean_up

      - name: Remove the private key
        if: always()
        run: rm -f "$RUNNER_TEMP/clair_pr_testing_f.p8"
