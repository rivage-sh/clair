name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Each job that runs at the same time needs its own cache key.
          cache-suffix: ${{ github.job }}

      - name: Build docs
        run: uv run --group docs mkdocs build -f site_docs/mkdocs.yml

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site_docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
