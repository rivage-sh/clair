name: Release

# A tag v<version> publishes that version of clair to PyPI. The tag must be
# equal to "v" + the version in pyproject.toml, and main must hold the tagged
# commit. Thus each version on PyPI has one git tag, and each tag has one
# version on PyPI.
#
# PyPI accepts the upload through trusted publishing: GitHub gives the job a
# short-lived token, thus no PyPI token is a secret of this repository.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The ancestor test below needs the history of main.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Compare the tag with the version in pyproject.toml
        run: |
          project_version="$(uv version --short)"
          if [ "v${project_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not v${project_version}, the version in pyproject.toml. Delete the tag, and tag the commit that sets the version."
            exit 1
          fi

      - name: Require that main holds the tagged commit
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::main does not hold ${GITHUB_SHA}. Merge the pull request, and tag the commit on main."
            exit 1
          fi

      # The integration tests need Snowflake credentials and credits. The pull
      # request ran them, thus this job runs the unit tests only.
      - name: Run tests
        run: uv run pytest -m "not integration"

      - name: Build the sdist and the wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The PyPI trusted publisher names this environment. Add a required
    # reviewer to it in the repository settings to approve each upload.
    environment:
      name: pypi
      url: https://pypi.org/project/rivage-clair/
    permissions:
      # The OIDC token of trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
