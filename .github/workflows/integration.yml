name: Integration

# SECURITY: the trigger must stay `pull_request`. `pull_request_target` gives
# the Snowflake credentials to code that no maintainer read.
# See tests/integration/README.md.

on:
  # `ready_for_review` is not a default type. Without it a draft pull request
  # that becomes ready starts no run, and the job stays absent until the next
  # push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A new push makes the run of the push before it useless, thus cancel it and
# keep the credits. `integration-clean-up.yml` drops the schema of the pull
# request when the pull request closes, thus a cancelled run leaves no schema
# behind for long.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snowflake:
    name: Snowflake
    # A draft pull request runs no integration test, because the suite uses
    # Snowflake credits. Mark the pull request ready for review to run it, or
    # start the workflow by hand with workflow_dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: snowflake-integration

    env:
      CLAIR_PR_TESTING_SCHEMA_NAME: >-
        ${{ github.event_name == 'pull_request'
            && format('pr_{0}', github.event.pull_request.number)
            || format('run_{0}', github.run_id) }}
      CLAIR_PR_TESTING_SNOWFLAKE_ACCOUNT: ${{ secrets.CLAIR_PR_TESTING_SNOWFLAKE_ACCOUNT }}
      # Without this variable an absent secret makes each test skip, and the
      # job stays green after it ran nothing.
      CLAIR_PR_TESTING_REQUIRE_SNOWFLAKE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Each job that runs at the same time needs its own cache key.
          cache-suffix: ${{ github.job }}

      - name: Install deps
        run: uv sync

      - name: Write the private key
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.CLAIR_PR_TESTING_SNOWFLAKE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/clair_pr_testing_f.p8"
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 -d > "$key_path"
          chmod 600 "$key_path"
          head -n 1 "$key_path" | grep -q 'BEGIN .*PRIVATE KEY'
          echo "CLAIR_PR_TESTING_SNOWFLAKE_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # The drop belongs here and not in a fixture. Each xdist worker runs the
      # session fixtures, thus a drop in a fixture would remove the tables of a
      # worker that still runs.
      - name: Prepare the schema
        run: uv run python -m tests.integration.setup

      # The worker count is a fixed number, and not `auto`. `auto` counts the
      # CPUs of the runner, but these tests wait for Snowflake, thus the CPU
      # count measures nothing here.
      #
      # The warehouse is the limit. CLAIR_PR_TESTING_WH is XSMALL, and
      # MAX_CONCURRENCY_LEVEL gives 8 query slots. A larger warehouse gives no
      # more slots. Each `clair.run()` also uses 4 threads, thus 6 workers ask
      # for 24 slots, and Snowflake puts the rest in a queue. A worker still
      # helps, because it compiles and copies a project while it holds no slot.
      #
      # `pyproject.toml` holds `--dist loadscope`, which keeps each test class
      # on one worker.
      - name: Run the integration tests
        run: uv run pytest tests/integration -m integration -v -n 6

      - name: Remove the private key
        if: always()
        run: rm -f "$RUNNER_TEMP/clair_pr_testing_f.p8"
